<app-nav-bar/>

<div class="page">
  <div class="checkout-container">
    <h2>Megrendelő adatai</h2>

    <div class="field">
      <label>Teljes név:</label>
      <input type="text" [(ngModel)]="name" placeholder="Pl. Kovács János">
    </div>

    <div class="field">
      <label>Email cím:</label>
      <input type="email" [(ngModel)]="email" placeholder="Pl. pelda@gmail.com">
    </div>

    <div class="field">
      <label>Cím:</label>
      <input type="text" [(ngModel)]="address" placeholder="Pl. Budapest, Fő utca 1.">
    </div>

    <div class="field">
      <label>Telefonszám:</label>
      <input type="text" [(ngModel)]="phone" placeholder="Pl. +36 30 123 4567">
    </div>

    <div class="field">
      <label>Összeg:</label>
      <input type="text" [value]="total + ' Ft'" readonly>
    </div>

    <div class="field">
      <label>Fizetési mód:</label>
      <select [(ngModel)]="selectedPayment">
        <option value="">↓</option>
        <option value="card">Bankkártya</option>
        <option value="cash">Készpénz</option>
        <option value="transfer">Átutalás</option>
      </select>
    </div>

    <ng-container *ngIf="!isLoggedIn">
      <hr class="divider">
      <p class="account-info">Szeretne fiókot létrehozni a rendeléssel?</p>

      <div class="field">
        <label>Jelszó (opcionális):</label>
        <input type="password" [(ngModel)]="password" placeholder="Adjon meg jelszót">
      </div>

      <div class="field">
        <label>Jelszó mégegyszer:</label>
        <input type="password" [(ngModel)]="confirmPassword" placeholder="Jelszó megerősítése">
      </div>

      <div class="login-link">
        Már van fiókja? <a routerLink="/login">Jelentkezzen be</a>
      </div>
    </ng-container>

    <div class="bottom-row">
      <button class="pay-btn" (click)="pay()">Fizetés</button>
    </div>
  </div>
</div>
