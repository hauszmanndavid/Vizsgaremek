<app-nav-bar/>

<div class="page">
  <div class="profile-container">
    <div class="avatar-box" (click)="fileInput.click()">
      <img *ngIf="profileImage" [src]="profileImage" alt="Profilkép" class="profile-img">
      <svg *ngIf="!profileImage" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="#e5ecf3" width="100" height="100">
        <path d="M12 12c2.7 0 4.8-2.1 4.8-4.8S14.7 2.4 12 2.4 7.2 4.5 7.2 7.2 9.3 12 12 12zm0 2.4c-3.2 0-9.6 1.6-9.6 4.8v2.4h19.2v-2.4c0-3.2-6.4-4.8-9.6-4.8z"/>
      </svg>
      <div class="avatar-overlay">Kép módosítása</div>
      <input #fileInput type="file" accept="image/*" (change)="onImageUpload($event)" style="display:none">
    </div>
    <div class="info-section">
      <h2>Profil</h2>
      <p><strong>Név:</strong> {{ name }}</p>
      <p><strong>Email:</strong> {{ email }}</p>
      <p><strong>Telefonszám:</strong> {{ phone }}</p>
      <p><strong>Lakcím:</strong> {{ address }}</p>
    </div>
  </div>
</div>
