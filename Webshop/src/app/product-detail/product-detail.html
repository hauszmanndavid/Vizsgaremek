<app-nav-bar/>

<div class="page">
  <div class="product-container">
    <div class="image-section">
      <img [src]="images[currentImageIndex]" [alt]="product.name">
      <div class="dots">
        <span *ngFor="let img of images; let i = index"
              class="dot"
              [class.active]="i === currentImageIndex"
              (click)="currentImageIndex = i">
        </span>
      </div>
    </div>

    <div class="info-section">
      <div>
        <h1 class="product-name">{{ product.name }}</h1>
        <p class="product-price">{{ product.price }} Ft</p>
        <hr class="divider">
        <p class="product-description">{{ product.description }}</p>
      </div>

      <div class="actions">
        <button class="btn orange" (click)="addToCart()">Kosárba</button>
        <button class="btn outline" (click)="addToFavorites()">♡ Kedvencekhez adás</button>
      </div>
    </div>
  </div>
</div>
